

 {% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="{% static 'Login/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main">


        <div class="login" style="padding-top: 60px;">
            <form action="" method="post">
                {% csrf_token %}
                <label for="chk" aria-hidden="true">Login</label>
                <input type="email" name="txt_email" placeholder="Email" required="">
                <input type="password" name="txt_password" placeholder="Password" required="">
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
{% if msg %}
<script>
    alert("{{msg}}")
</script>
{% endif %}

</html>
